name: Fixture Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run fixture sync
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          python - << 'EOF'
          import requests, os

          AIRTABLE_TOKEN = os.environ['AIRTABLE_TOKEN']
          AIRTABLE_BASE_ID = os.environ['AIRTABLE_BASE_ID']
          FOOTBALL_DATA_KEY = os.environ['FOOTBALL_DATA_KEY']

          AIRTABLE_HEADERS = {
              'Authorization': f'Bearer {AIRTABLE_TOKEN}',
              'Content-Type': 'application/json'
          }

          print("Fetching fixtures from football-data.org...")
          url = f'https://api.football-data.org/v4/competitions/PL/matches?season=2026'
          resp = requests.get(url, headers={'X-Auth-Token': FOOTBALL_DATA_KEY})
          resp.raise_for_status()
          matches = resp.json()['matches']
          print(f"Got {len(matches)} matches")

          matches = [m for m in matches if m.get('matchday', 99) <= 19]
          print(f"Filtered to {len(matches)} matches (GW1-19)")

          print("Fetching existing Airtable fixtures...")
          records = []
          offset = None
          while True:
              params = {'pageSize': 100}
              if offset:
                  params['offset'] = offset
              resp = requests.get(
                  f'https://api.airtable.com/v0/{AIRTABLE_BASE_ID}/Fixtures',
                  headers=AIRTABLE_HEADERS,
                  params=params
              )
              data = resp.json()
              records.extend(data.get('records', []))
              offset = data.get('offset')
              if not offset:
                  break
          existing = {r['fields'].get('Fixture ID'): r['id'] for r in records}
          print(f"Found {len(existing)} existing records")

          updated = 0
          created = 0
          for match in matches:
              fixture_id = match['id']
              fields = {
                  'Fixture ID': fixture_id,
                  'Home Team': match['homeTeam']['name'],
                  'Away Team': match['awayTeam']['name'],
                  'Date': match['utcDate'],
                  'Status': match['status'],
                  'Matchday': match.get('matchday'),
              }
              if fixture_id in existing:
                  resp = requests.patch(
                      f'https://api.airtable.com/v0/{AIRTABLE_BASE_ID}/Fixtures/{existing[fixture_id]}',
                      headers=AIRTABLE_HEADERS,
                      json={'fields': fields}
                  )
                  updated += 1
              else:
                  resp = requests.post(
                      f'https://api.airtable.com/v0/{AIRTABLE_BASE_ID}/Fixtures',
                      headers=AIRTABLE_HEADERS,
                      json={'fields': fields}
                  )
                  created += 1
              if resp.status_code not in (200, 201):
                  print(f"Error on fixture {fixture_id}: {resp.text}")

          print(f"Done — Updated: {updated}, Created: {created}")
          EOF
